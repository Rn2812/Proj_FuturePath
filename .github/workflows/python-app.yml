name: Validação

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

permissions:
  contents: read

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Validar estrutura do notebook
        run: |
          pip install nbformat
          python -c "import nbformat; nb = nbformat.read('ARQUIVO_FINAL_FUTUREPATH.ipynb', as_version=4); nbformat.validate(nb); print(len(nb.cells), 'células válidas')"
